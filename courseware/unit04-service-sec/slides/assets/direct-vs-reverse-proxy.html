<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>直接暴露 vs 反向代理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100%; height: 100%;
    background: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #222;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 2vh 3vw;
  }
  .container {
    position: relative;
    width: 1500px; height: 680px;
  }
  .columns {
    display: flex;
    gap: 32px;
    height: 100%;
  }
  .column {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* Column headers */
  .col-header {
    text-align: center;
    padding: 16px 0;
    border-radius: 10px 10px 0 0;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
  }
  .col-header.bad { background: #C0392B; }
  .col-header.good { background: #0366D6; }

  /* Content area */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    border-radius: 0 0 10px 10px;
    gap: 16px;
  }
  .content.bad { background: #FDF2F0; border: 2px solid #E8B4A8; border-top: none; }
  .content.good { background: #EBF4FF; border: 2px solid #A8C8E8; border-top: none; }

  /* Flow nodes */
  .flow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
  }
  .node {
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    min-width: 140px;
  }
  .bad .node { background: #fff; color: #C0392B; border: 2px solid #E8B4A8; }
  .good .node { background: #fff; color: #0366D6; border: 2px solid #A8C8E8; }
  .good .node.proxy { background: #0366D6; color: #fff; border-color: #0366D6; }

  .arrow {
    font-size: 22px;
    font-weight: 700;
  }
  .bad .arrow { color: #C0392B; }
  .good .arrow { color: #0366D6; }

  .label {
    font-size: 13px;
    color: #888;
    text-align: center;
    margin-top: -4px;
  }
  .bad .label { color: #B05040; }
  .good .label { color: #4A7A9A; }

  /* Warning / check badges */
  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
  }
  .badge {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  .bad .badge { background: #FDECEA; color: #B33A2C; border: 1px solid #E8A8A0; }
  .good .badge { background: #E0EDFF; color: #0A4A8A; border: 1px solid #A0C0E0; }

  /* Bottom summary */
  .summary {
    margin-top: auto;
    width: 100%;
  }
  .summary-line {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px;
    font-size: 13px;
    color: #555;
  }
  .summary-line .icon { font-weight: 700; flex-shrink: 0; width: 18px; text-align: center; }
</style>
</head>
<body>

<div class="container">
  <div class="columns">
    <!-- Left: Direct exposure -->
    <div class="column">
      <div class="col-header bad">方案 A：直接暴露（不推荐）</div>
      <div class="content bad">
        <div class="flow">
          <div class="node">用户浏览器</div>
          <div class="arrow">→→→→→→→→→→→→</div>
          <div class="node">Python 应用<br/><small style="font-weight:400;opacity:0.7">:8000</small></div>
        </div>
        <div class="label">公网直达，无防护</div>
        <div class="badges">
          <div class="badge">慢连接攻击风险</div>
          <div class="badge">无静态文件优化</div>
          <div class="badge">无 SSL 卸载</div>
          <div class="badge">无负载均衡</div>
        </div>
      </div>
    </div>

    <!-- Right: Reverse proxy -->
    <div class="column">
      <div class="col-header good">方案 B：反向代理（推荐）</div>
      <div class="content good">
        <div class="flow">
          <div class="node">用户浏览器</div>
          <div class="arrow">→</div>
          <div class="node proxy">Nginx<br/><small style="font-weight:400;opacity:0.8">:80 / :443</small></div>
          <div class="arrow">→</div>
          <div class="node">Python 应用<br/><small style="font-weight:400;opacity:0.7">:8000</small></div>
        </div>
        <div class="label">公网入口 → 内网转发</div>
        <div class="badges">
          <div class="badge">安全：抗慢连接</div>
          <div class="badge">性能：静态文件 + Gzip</div>
          <div class="badge">灵活：负载均衡 + SSL</div>
          <div class="badge">统一日志</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var c=document.querySelector('.container');
  if(!c)return;
  var ow=1500,oh=680;
  function scale(){var sx=window.innerWidth/ow,sy=window.innerHeight/oh,s=Math.min(sx,sy,1);c.style.transform='scale('+s+')';c.style.transformOrigin='top center';document.body.style.overflow='hidden';document.body.style.height=(c.scrollHeight*s)+'px';}
  window.addEventListener('resize',scale);scale();
})();
</script>
</body>
</html>
