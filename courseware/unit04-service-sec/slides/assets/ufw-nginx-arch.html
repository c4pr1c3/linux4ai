<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UFW 与 Nginx 联动</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100%; height: 100%;
    background: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #222;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 3vh 5vw;
  }
  .container {
    position: relative;
    width: 1400px; height: 700px;
  }
  .title {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 20px;
  }

  .arch {
    display: flex;
    align-items: stretch;
    gap: 0;
  }

  /* Left: Internet */
  .internet {
    width: 160px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .internet .cloud {
    padding: 16px 24px;
    border-radius: 12px;
    background: #F0F0F0;
    font-size: 16px;
    font-weight: 700;
    color: #555;
    text-align: center;
    border: 2px dashed #ccc;
  }
  .internet .arrow {
    font-size: 28px;
    font-weight: 700;
    color: #888;
  }

  /* Server box */
  .server {
    flex: 1;
    border: 3px solid #0366D6;
    border-radius: 14px;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 0;
    position: relative;
    background: #FAFCFF;
  }
  .server-label {
    position: absolute;
    top: -14px;
    left: 24px;
    background: #0366D6;
    color: #fff;
    padding: 4px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
  }

  /* Layers inside server */
  .layer {
    padding: 14px 20px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .layer-ufw {
    background: #FFF3E0;
    border: 2px solid #F5B041;
    margin-bottom: 12px;
  }
  .layer-ufw .layer-icon {
    width: 44px; height: 44px;
    border-radius: 8px;
    background: #F5B041;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 800;
    flex-shrink: 0;
  }
  .layer-ufw .layer-info h3 {
    font-size: 16px; font-weight: 700; color: #E67E22; margin-bottom: 4px;
  }
  .layer-ufw .port-list {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .port {
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    font-family: 'Fira Code', Consolas, monospace;
  }
  .port.allow { background: #E8F5E9; color: #2E7D32; border: 1px solid #A5D6A7; }
  .port.deny { background: #FFEBEE; color: #C62828; border: 1px solid #EF9A9A; text-decoration: line-through; }

  .layer-nginx {
    background: #EBF4FF;
    border: 2px solid #A8C8E8;
    margin-bottom: 12px;
  }
  .layer-nginx .layer-icon {
    width: 44px; height: 44px;
    border-radius: 8px;
    background: #0366D6;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 800;
    flex-shrink: 0;
  }
  .layer-nginx .layer-info h3 {
    font-size: 16px; font-weight: 700; color: #0366D6; margin-bottom: 4px;
  }
  .layer-nginx .layer-info p {
    font-size: 13px; color: #555;
  }

  .layer-app {
    background: #F3E5F5;
    border: 2px solid #CE93D8;
  }
  .layer-app .layer-icon {
    width: 44px; height: 44px;
    border-radius: 8px;
    background: #8E24AA;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 800;
    flex-shrink: 0;
  }
  .layer-app .layer-info h3 {
    font-size: 16px; font-weight: 700; color: #8E24AA; margin-bottom: 4px;
  }
  .layer-app .layer-info p {
    font-size: 13px; color: #555;
  }

  /* Arrows between layers */
  .layer-arrow {
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: #aaa;
    padding: 0;
    margin: -4px 0;
  }

  /* Bottom note */
  .bottom-note {
    margin-top: 16px;
    display: flex;
    gap: 24px;
    justify-content: center;
  }
  .note {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    color: #555;
    background: #F8F9FA;
    border: 1px solid #E0E0E0;
  }
  .note .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .note .dot.green { background: #2E7D32; }
  .note .dot.red { background: #C62828; }
</style>
</head>
<body>

<div class="container">
  <div class="title">UFW 与 Nginx 联动：最小暴露面</div>

  <div class="arch">
    <!-- Internet -->
    <div class="internet">
      <div class="cloud">Internet</div>
      <div class="arrow">→</div>
    </div>

    <!-- Server -->
    <div class="server">
      <div class="server-label">服务器</div>

      <!-- UFW Layer -->
      <div class="layer layer-ufw">
        <div class="layer-icon">UFW</div>
        <div class="layer-info">
          <h3>UFW 防火墙</h3>
          <div class="port-list">
            <span class="port allow">:22 SSH</span>
            <span class="port allow">:80 HTTP</span>
            <span class="port allow">:443 HTTPS</span>
            <span class="port deny">:8080 内部端口</span>
          </div>
        </div>
      </div>

      <div class="layer-arrow">↓</div>

      <!-- Nginx Layer -->
      <div class="layer layer-nginx">
        <div class="layer-icon">Nx</div>
        <div class="layer-info">
          <h3>Nginx 反向代理 (:80 / :443)</h3>
          <p>公网入口 → 转发请求到后端应用</p>
        </div>
      </div>

      <div class="layer-arrow">↓</div>

      <!-- App Layer -->
      <div class="layer layer-app">
        <div class="layer-icon">Py</div>
        <div class="layer-info">
          <h3>Python App (:8080)</h3>
          <p>内部端口，外部无法直连，仅 Nginx 可访问</p>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-note">
    <div class="note">
      <div class="dot green"></div>
      外部可访问：:80 (HTTP) / :443 (HTTPS)
    </div>
    <div class="note">
      <div class="dot red"></div>
      外部不可访问：:8080（仅 Nginx 内部转发）
    </div>
  </div>
</div>

<script>
(function(){
  var c=document.querySelector('.container');
  if(!c)return;
  var ow=1400,oh=700;
  function scale(){var sx=window.innerWidth/ow,sy=window.innerHeight/oh,s=Math.min(sx,sy,1);c.style.transform='scale('+s+')';c.style.transformOrigin='top center';document.body.style.overflow='hidden';document.body.style.height=(c.scrollHeight*s)+'px';}
  window.addEventListener('resize',scale);scale();
})();
</script>
</body>
</html>
